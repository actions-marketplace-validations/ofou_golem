# Unit tests on Linux, with real sandbox containers, on every push and pull request.
# No secrets: the three live Jev tests skip without OPENROUTER_API_KEY.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Golem (pinned SDK)
        run: pip install .
      - name: The installed package carries the same licence
        run: |
          cd "$RUNNER_TEMP"
          golem licence | tail -1
          test "$(golem licence | tail -1 | cut -d' ' -f2)" = "$(sha256sum "$GITHUB_WORKSPACE/authority.json" | cut -d' ' -f1)"
      - name: Pull the sandbox image
        run: docker pull python:3.12-slim
      - name: Tests
        run: python -m unittest discover -s tests -v
